name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:theme
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:size

  # The two Markdown gates of scripts/gates.conf, over what a clone holds. Not the whole list: the jobs here already run
  # the npm gates, and CLAUDE.md and docs/HANDOFF.md (named in the md-wrap gate) are local-only, so a clone lacks them.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/md_wrap_check.py README.md CONTRIBUTING.md docs
      - run: python3 scripts/adr_check.py

  # Real-browser coverage the jsdom unit suite can't give: caret-driven marker
  # reveal, floating-popup positioning, the sticky-toolbar watchdog, KaTeX.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # The peer range is React >= 18, but dev pins React 19. Prove 18 still works.
  react18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm i --no-save react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18
      - run: npm run typecheck
      - run: npm run test

  # Consumers a TypeScript major behind (e.g. Sympose) must still typecheck
  # against the shipped .d.ts.
  typescript6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm i --no-save typescript@~6
      - run: npm run typecheck
      - run: npm run build

  # Prove a real downstream project can install and use the published package:
  # npm pack -> install the tarball into a throwaway consumer -> tsc -> vite build.
  # The consumer is pinned to @types/react@18, so a React-19-only type in the
  # shipped .d.ts fails here.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:package
