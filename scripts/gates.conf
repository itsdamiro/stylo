# One gate per line:  name | directory (from the repo root) | command
# Mirrors CONTRIBUTING.md "Making changes". Order matters: build before size and package.
format    | . | npm run format:check
theme     | . | npm run check:theme
typecheck | . | npm run typecheck
test      | . | npm run test
browser   | . | npm run test:browser   # needs `npx playwright install chromium` once
build     | . | npm run build
size      | . | npm run check:size
package   | . | npm run check:package
# Every tracked Markdown file; docs/requests is local-only and left out.
md-wrap   | . | python3 scripts/md_wrap_check.py CLAUDE.md README.md CONTRIBUTING.md docs/HANDOFF.md docs/PROJECT_JOURNAL.md docs/COLLABORATION_STANDARDS.md docs/CODE_QUALITY_STANDARDS.md docs/CLOSING_A_SLICE.md docs/VAULT_CONVENTIONS.md docs/reference docs/decisions docs/sop docs/journal docs/wiki
adr-check | . | python3 scripts/adr_check.py
# The same files; a link into the local-only docs/requests would pass here and be dead on GitHub, so CI checks a clone too.
links     | . | python3 scripts/check_links.py README.md CONTRIBUTING.md CLAUDE.md docs/HANDOFF.md docs/PROJECT_JOURNAL.md docs/COLLABORATION_STANDARDS.md docs/CODE_QUALITY_STANDARDS.md docs/CLOSING_A_SLICE.md docs/VAULT_CONVENTIONS.md docs/reference docs/decisions docs/sop docs/journal docs/wiki
