# One gate per line:  name | directory (from the repo root) | command
# Mirrors CONTRIBUTING.md "Making changes". Order matters: build before size and package.
format    | . | npm run format:check
theme     | . | npm run check:theme
typecheck | . | npm run typecheck
test      | . | npm run test
browser   | . | npm run test:browser   # needs `npx playwright install chromium` once
build     | . | npm run build
size      | . | npm run check:size
package   | . | npm run check:package
# Only files the template added: the older docs/ are hard-wrapped and move over when their ADRs are migrated.
md-wrap   | . | python3 scripts/md_wrap_check.py CLAUDE.md docs/HANDOFF.md docs/COLLABORATION_STANDARDS.md docs/CODE_QUALITY_STANDARDS.md docs/CLOSING_A_SLICE.md docs/VAULT_CONVENTIONS.md docs/reference docs/decisions docs/sop
adr-check | . | python3 scripts/adr_check.py
